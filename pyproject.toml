[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vhirprimerlab"
version = "0.2.0"
description = "Design consensus PCR primers from a multi-FASTA of related sequences"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["biopython>=1.81", "primer3-py>=2.0"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.18"]

[project.scripts]
vhirprimerlab = "vhirprimerlab.cli:main"

[tool.setuptools]
packages = ["vhirprimerlab", "vhirprimerlab.web"]

[tool.setuptools.package-data]
"vhirprimerlab.web" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
