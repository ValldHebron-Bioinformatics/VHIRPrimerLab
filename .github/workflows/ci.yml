name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MAFFT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mafft
      - name: Install the package
        run: pip install -e ".[dev,web]"
      - name: Install the browser test dependencies
        run: npm ci
        working-directory: tests/browser
      - name: Run the tests
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
