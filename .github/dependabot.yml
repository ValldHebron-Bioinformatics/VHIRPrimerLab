version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /tests/browser
    schedule: {interval: weekly}
    # The engine the site ships is pinned in tools/pyodide-0.27.7.json (with hashes); this npm
    # copy only mirrors it for the browser tests, so it moves together with that pin, by hand.
    # Every version is ignored, not only majors: while Pyodide is at 0.x, a jump such as 0.27 to
    # 0.29 is a "minor" update and slipped past a major-only rule.
    ignore:
      - dependency-name: pyodide
